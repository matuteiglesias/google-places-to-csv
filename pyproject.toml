[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-places-to-csv"
version = "0.2.0"
description = "Governed local-business discovery with cost-aware Google Places and provider-ready output contracts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Matías Iglesias"},
]
dependencies = [
  "requests>=2.31,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/matuteiglesias/google-places-to-csv"

[project.scripts]
google-places-to-csv = "gmaps_scraper.cli:main"
local-business-discover = "gmaps_scraper.cli:main"
places-costcheck = "gmaps_scraper.costcheck:main"

[tool.setuptools.packages.find]
include = ["gmaps_scraper*"]
